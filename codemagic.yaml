workflows:
  maui-ios-build:
    name: CeramicManager iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
    scripts:
      - name: Build iOS Application
        script: |
          # إضافة مسار دوت نت الافتراضي
          export PATH=$PATH:/usr/local/share/dotnet
          export DOTNET_ROOT=/usr/local/share/dotnet
          
          # تثبيت بيئة العمل
          dotnet workload install maui
          
          # تحويل وضع البناء إلى Debug ليتخطى حماية آبل بدون حساب مدفوع
          dotnet build CeramicManager.csproj -c Debug -f net9.0-ios /p:EnableCodeSigning=false /p:CompileEntitlements=false
    artifacts:
      - $CM_BUILD_DIR/**/*.app
