workflows:
  maui-ios-build:
    name: CeramicManager iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # هذه الميزة تجعل الخادم يجهز دوت نت 9 تلقائياً قبل بدء الأكواد
      groups:
        - dotnet
    triggering:
      events:
        - push
    scripts:
      - name: Build iOS Application
        script: |
          dotnet workload install maui
          dotnet build CeramicManager.csproj -c Release -f net9.0-ios
    artifacts:
      - $CM_BUILD_DIR/**/*.ipa
