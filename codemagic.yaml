workflows:
  maui-ios-build:
    name: CeramicManager iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        DOTNET_VERSION: "9.0.x"
    triggering:
      events:
        - push
    scripts:
      - name: Build iOS Application
        script: |
          dotnet workload install maui
          dotnet build CeramicManager.csproj -c Release -f net9.0-ios
    artifacts:
      - $CM_BUILD_DIR/**/*.ipa
