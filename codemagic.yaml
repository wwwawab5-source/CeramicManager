workflows:
  maui-ios-build:
    name: CeramicManager iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/dotnet
        DOTNET: $CM_BUILD_DIR/dotnet/dotnet
      ios_signing:
        distribution_type: development
        bundle_identifier: com.companyname.ceramicmanager

    scripts:
      - name: Install .NET SDK
        script: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --install-dir "$DOTNET_PATH"

      - name: Install MAUI
        script: |
          $DOTNET workload install ios maui

      - name: Build iOS
        script: |
          $DOTNET publish CeramicManager.csproj \
            -f net10.0-ios \
            -c Release \
            -p:BuildIpa=true \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false \
            -p:ApplicationId=com.companyname.ceramicmanager \
            -o "$CM_BUILD_DIR/artifacts"

    artifacts:
      - $CM_BUILD_DIR/artifacts/*.ipa
