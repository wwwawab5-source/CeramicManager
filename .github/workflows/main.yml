name: Build MAUI iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Build iOS App
      run: dotnet build CeramicManager.csproj -c Release -f net8.0-ios /p:ArchiveOnBuild=true /p:EnableCodeSigning=false

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-App
        path: bin/Release/net8.0-ios/**/*.ipa
